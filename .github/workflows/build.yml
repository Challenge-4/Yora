name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Clés (Secrets GitHub)
        shell: bash
        env:
          YORA_API_KEYS: ${{ secrets.YORA_API_KEYS }}
        run: printf '%s\n' "$YORA_API_KEYS" > lib/api_keys.dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev mpv libayatana-appindicator3-dev libkeybinder-3.0-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Embarquer yt-dlp, ffmpeg (LGPL) et les scripts d'installation/désinstallation
        run: |
          BUNDLE=build/linux/x64/release/bundle
          curl -L -o "$BUNDLE/yt-dlp" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          curl -L -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-lgpl.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-lgpl/bin/ffmpeg ffmpeg-master-latest-linux64-lgpl/bin/ffprobe "$BUNDLE/"
          cp ffmpeg-master-latest-linux64-lgpl/LICENSE.txt "$BUNDLE/FFMPEG_LICENSE.txt"
          cp linux/packaging/install.sh linux/packaging/uninstall.sh "$BUNDLE/"
          chmod +x "$BUNDLE/yt-dlp" "$BUNDLE/ffmpeg" "$BUNDLE/ffprobe" "$BUNDLE/install.sh" "$BUNDLE/uninstall.sh"
      - name: Test de démarrage
        run: |
          sudo apt-get install -y xvfb imagemagick dbus-x11 libgl1-mesa-dri libegl1 libgles2
          BUNDLE=build/linux/x64/release/bundle
          "$BUNDLE/yt-dlp" --version
          "$BUNDLE/ffmpeg" -hide_banner -version | head -1
          "$BUNDLE/ffprobe" -hide_banner -version | head -1
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 3
          dbus-run-session -- "$BUNDLE/yora" > yora-startup-linux.log 2>&1 &
          PID=$!
          sleep 30
          import -window root yora-startup-linux.png || true
          cat yora-startup-linux.log
          if kill -0 "$PID" 2>/dev/null; then
            echo "Yora tourne toujours après 30 secondes"
            kill "$PID"
          else
            echo "Yora s'est arrêté au démarrage" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: startup-test-linux
          path: |
            yora-startup-linux.log
            yora-startup-linux.png
          if-no-files-found: ignore
      - run: tar -czf yora-linux-x64.tar.gz -C build/linux/x64/release --transform 's,^bundle,yora,' bundle
      - uses: actions/upload-artifact@v7
        with:
          name: yora-linux
          path: yora-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clés (Secrets GitHub)
        shell: bash
        env:
          YORA_API_KEYS: ${{ secrets.YORA_API_KEYS }}
        run: printf '%s\n' "$YORA_API_KEYS" > lib/api_keys.dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Embarquer yt-dlp, ffmpeg et ffprobe
        run: |
          APP=build/macos/Build/Products/Release/Yora.app
          BIN="$APP/Contents/MacOS"
          curl -L -o "$BIN/yt-dlp" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          for tool in ffmpeg ffprobe; do
            for arch in arm64 amd64; do
              curl -L -o "$tool-$arch.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/$tool.zip"
              unzip -o "$tool-$arch.zip" -d "$tool-$arch"
            done
            lipo -create "$tool-arm64/$tool" "$tool-amd64/$tool" -output "$BIN/$tool"
          done
          chmod +x "$BIN/yt-dlp" "$BIN/ffmpeg" "$BIN/ffprobe"
          curl -L -o "$APP/Contents/Resources/FFMPEG_LICENSE.txt" https://raw.githubusercontent.com/FFmpeg/FFmpeg/master/COPYING.GPLv3
      - name: Désinstalleur
        run: |
          APP=build/macos/Build/Products/Release/Yora.app
          UNINSTALLER="Désinstaller Yora.app"
          osacompile -o "$UNINSTALLER" macos/packaging/uninstaller.applescript
          cp macos/packaging/uninstall.sh "$UNINSTALLER/Contents/Resources/uninstall.sh"
          codesign --force --deep -s - "$UNINSTALLER"
          cp -R "$UNINSTALLER" "$APP/Contents/Resources/"
          codesign --force --deep -s - "$APP"
          mkdir -p dist/Yora
          cp -R "$APP" "$UNINSTALLER" dist/Yora/
      - name: Test de démarrage
        run: |
          APP=dist/Yora/Yora.app
          BIN="$APP/Contents/MacOS"
          for tool in yt-dlp ffmpeg ffprobe; do
            echo "$tool : $(lipo -archs "$BIN/$tool")"
          done
          "$BIN/yt-dlp" --version
          "$BIN/ffmpeg" -hide_banner -version | head -1
          "$BIN/ffprobe" -hide_banner -version | head -1
          if find "$APP/Contents" -type f -perm -u+x -exec otool -L {} + 2>/dev/null | grep -E "^[[:space:]]+(/opt/homebrew|/usr/local)"; then
            echo "Yora dépend d'une bibliothèque externe" >&2
            exit 1
          fi
          codesign --verify --deep "$APP" && echo "Signature valide" || echo "Signature à vérifier"
          "$BIN/Yora" > yora-startup.log 2>&1 &
          PID=$!
          sleep 30
          screencapture -x yora-startup.png || true
          cat yora-startup.log
          if kill -0 "$PID" 2>/dev/null; then
            echo "Yora tourne toujours après 30 secondes"
            kill "$PID"
          else
            echo "Yora s'est arrêté au démarrage" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: startup-test-macos
          path: |
            yora-startup.log
            yora-startup.png
          if-no-files-found: ignore
      - run: ditto -c -k --keepParent dist/Yora yora-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: yora-macos
          path: yora-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clés (Secrets GitHub)
        shell: bash
        env:
          YORA_API_KEYS: ${{ secrets.YORA_API_KEYS }}
        run: printf '%s\n' "$YORA_API_KEYS" > lib/api_keys.dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Binaires embarqués par l'installeur
        shell: bash
        run: |
          B=windows/packaging/bundled
          curl -L -o "$B/yt-dlp.exe" https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          7z e ffmpeg.zip -o"$B" "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe" "*/LICENSE.txt"
          mv "$B/LICENSE.txt" "$B/FFMPEG_LICENSE.txt"
          curl -L -o "$B/vc_redist.x64.exe" https://aka.ms/vs/17/release/vc_redist.x64.exe
      - name: Installeur Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\packaging\yora_setup.iss
          Move-Item windows\packaging\output\YoraSetup.exe yora-windows-setup.exe
      - name: Test d'installation et de démarrage
        shell: pwsh
        run: |
          $setup = Start-Process .\yora-windows-setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "L'installeur a échoué (code $($setup.ExitCode))" }
          $dir = Join-Path $env:ProgramFiles 'Yora'
          foreach ($file in 'yora.exe', 'yt-dlp.exe', 'ffmpeg.exe', 'ffprobe.exe', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "$file manque après l'installation" }
          }
          & (Join-Path $dir 'yt-dlp.exe') --version
          $app = Start-Process (Join-Path $dir 'yora.exe') -PassThru
          Start-Sleep -Seconds 30
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save((Join-Path $PWD 'yora-startup-windows.png'))
          } catch {
            Write-Output "Capture d'écran impossible : $_"
          }
          if ($app.HasExited) { throw "Yora s'est arrêté au démarrage (code $($app.ExitCode))" }
          Write-Output 'Yora tourne toujours après 30 secondes'
          Stop-Process -Id $app.Id -Force
          Start-Sleep -Seconds 3
          $uninstall = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Le désinstalleur a échoué (code $($uninstall.ExitCode))" }
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path (Join-Path $dir 'yora.exe')) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
          if (Test-Path (Join-Path $dir 'yora.exe')) { throw 'yora.exe est encore présent après la désinstallation' }
          Write-Output 'Installation et désinstallation réussies'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: startup-test-windows
          path: yora-startup-windows.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: yora-windows
          path: yora-windows-setup.exe

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clés (Secrets GitHub)
        shell: bash
        env:
          YORA_API_KEYS: ${{ secrets.YORA_API_KEYS }}
        run: printf '%s\n' "$YORA_API_KEYS" > lib/api_keys.dart
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Paquet .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr yora-ios.ipa Payload
      - run: flutter build ios --simulator
      - name: Test de démarrage (simulateur)
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = [d for runtime, items in json.load(sys.stdin)['devices'].items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')]; print(devices[-1]['udid'])")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE" com.yora.app
          sleep 40
          xcrun simctl io "$DEVICE" screenshot yora-startup-ios.png || true
          if xcrun simctl spawn "$DEVICE" launchctl list | grep -q "com.yora.app"; then
            echo "Yora tourne toujours après 40 secondes"
          else
            echo "Yora s'est arrêté au démarrage" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: startup-test-ios
          path: yora-startup-ios.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: yora-ios
          path: yora-ios.ipa

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Clés (Secrets GitHub)
        shell: bash
        env:
          YORA_API_KEYS: ${{ secrets.YORA_API_KEYS }}
        run: printf '%s\n' "$YORA_API_KEYS" > lib/api_keys.dart
      - name: Clé de signature Android (Secrets GitHub)
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > android/app/yora-release.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk yora-android.apk
      - name: Libérer de l'espace disque
        run: |
          df -h /
          rm -rf build
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test de démarrage (émulateur)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r yora-android.apk
            adb shell pm grant com.yora.app android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p com.yora.app -c android.intent.category.LAUNCHER 1
            sleep 45
            adb exec-out screencap -p > yora-startup-android.png
            adb logcat -d -t 400 > yora-startup-android.log || true
            adb shell pidof com.yora.app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: startup-test-android
          path: |
            yora-startup-android.png
            yora-startup-android.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: yora-android
          path: yora-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, ios, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: yora-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
